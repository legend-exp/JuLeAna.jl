config:
  runmode: slurm
  submit_jobs: false
  runmode_settings:
    slurm:
      flags:
        - "--time=02:00:00"
        - "--mem-bind=local"
        - "--threads-per-core=1"
        - "--cpu-bind=cores"
        - "--nodes=1"
        - "--ntasks-per-node=64"
        - "--cpus-per-task=2"
        - "--mem=480GB"
      julia_settings: []
    local:
      n: 64
      julia_settings: []
  env_variables:
    GKSwstype: "100"
    JULIA_DEBUG: "JuLeAna,LegendSpecFits"
    JULIA_WORKER_TIMEOUT: "240"
  log_level: info
  idle_timeout_minutes: 20

processing:
  order: dependencies
  periods: [16, 18, 19, 20, 21, 22]
  runs: all
  analysis_runs_only: false
  only_partitions: false
  only_runs: false

processors:
