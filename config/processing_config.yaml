    detectors: "processable"
    report_status:
      on: {warning: failure, failure: failure}
      ac: {warning: warning, failure: failure}
      off: {warning: success, failure: warning}
    enabled: false
    category: cal
    log_level: info
    plot_level: info
    rank: 1
    kwargs:
      reprocess: false
      timeout: 0
    dependencies: []

  process_peak_split_cal:
